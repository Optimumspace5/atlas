# Atlas Taxonomy — v1.0 (frozen 2026-05-19)
#
# This is the frozen taxonomy used by the v1 corpus and annotation set.
# 8 parent concepts, 48 leaf concepts. Leaves only are annotatable
# (no parent fallback — see docs/ANNOTATION_GUIDELINES.md).
#
# Do not edit this file. New concepts go in a future taxonomy_v1.1.yaml.
# The working draft remains at data/taxonomy_v0.1.yaml.

taxonomy_version: "0.1"
domain: "investing_and_trading"

categories:

  - id: market_foundations
    name: Market Foundations
    description: >
      Covers the basic mechanics of how financial markets operate, including
      what is traded, who participates, how transactions happen, and how prices
      are formed. This is the foundational "how markets work" layer.
    leaf_concepts:
      - id: asset_classes_and_financial_instruments
        name: Asset Classes and Financial Instruments
        description: >
          Covers the main types of tradable assets and investment vehicles,
          including stocks, bonds, commodities, currencies, ETFs, derivatives,
          and cryptoassets.
      - id: market_participants_and_incentives
        name: Market Participants and Incentives
        description: >
          Covers the different actors in financial markets, such as retail
          investors, institutions, hedge funds, market makers, brokers, analysts,
          and regulators, along with the incentives that shape their behavior.
      - id: exchanges_brokers_and_market_infrastructure
        name: Exchanges, Brokers, and Market Infrastructure
        description: >
          Covers the systems and institutions that allow financial assets to be
          traded, cleared, settled, and held, including exchanges, brokerages,
          clearing houses, settlement systems, custody, and trading venues.
      - id: order_types_and_execution_mechanics
        name: Order Types and Execution Mechanics
        description: >
          Covers the practical mechanics of entering, exiting, and executing
          trades, including market orders, limit orders, stop orders, bid/ask
          prices, slippage, fills, spreads, and transaction costs.
      - id: liquidity_and_market_depth
        name: Liquidity and Market Depth
        description: >
          Covers how easily an asset can be bought or sold without significantly
          affecting its price, including liquidity, trading volume, bid-ask
          spreads, order book depth, thin markets, and market impact.
      - id: price_formation_and_market_efficiency
        name: Price Formation and Market Efficiency
        description: >
          Covers how market prices emerge from supply, demand, expectations,
          information, arbitrage, investor behavior, and competition among market
          participants.

  - id: fundamental_analysis_and_valuation
    name: Fundamental Analysis and Valuation
    description: >
      Covers how investors analyze businesses, estimate intrinsic value, and
      judge whether an asset is underpriced, overpriced, or fairly valued based
      on economic fundamentals. Essential for investing-oriented books.
    leaf_concepts:
      - id: financial_statement_analysis
        name: Financial Statement Analysis
        description: >
          Covers how to understand a company's financial health through its
          income statement, balance sheet, and cash flow statement, including
          revenue, expenses, profit, assets, liabilities, equity, free cash flow,
          margins, and financial ratios.
      - id: business_quality_and_competitive_advantage
        name: Business Quality and Competitive Advantage
        description: >
          Covers how to evaluate the durability and strength of a business model,
          including moats, pricing power, brand strength, economies of scale,
          network effects, switching costs, management quality, and long-term
          business durability.
      - id: intrinsic_value_estimation
        name: Intrinsic Value Estimation
        description: >
          Covers how to estimate what an asset or business is worth based on
          expected future cash flows or economic value, including intrinsic value,
          discounted cash flow, owner earnings, present value, and future cash
          flow assumptions.
      - id: valuation_multiples_and_relative_valuation
        name: Valuation Multiples and Relative Valuation
        description: >
          Covers how to compare valuation ratios across companies, sectors, or
          historical periods, including P/E ratio, P/B ratio, EV/EBITDA,
          price-to-sales, earnings yield, peer comparison, and relative cheapness
          or expensiveness.
      - id: earnings_growth_and_profitability_drivers
        name: Earnings, Growth, and Profitability Drivers
        description: >
          Covers the drivers of company value over time, including revenue growth,
          margin expansion, return on equity, return on invested capital,
          reinvestment, operating leverage, and long-term compounding.
      - id: margin_of_safety
        name: Margin of Safety
        description: >
          Covers the principle of buying assets at a sufficient discount to
          estimated value to reduce the risk of error, including valuation
          uncertainty, downside protection, conservative assumptions, and buying
          below intrinsic value.

  - id: technical_analysis_and_market_structure
    name: Technical Analysis and Market Structure
    description: >
      Covers how traders analyze price, volume, trends, and market behavior to
      identify patterns, timing, and potential trade setups.
    leaf_concepts:
      - id: trend_analysis
        name: Trend Analysis
        description: >
          Covers how to identify the direction and strength of price movement
          over time, including uptrends, downtrends, trendlines, higher highs and
          higher lows, lower highs and lower lows, moving averages, trend
          continuation, and trend reversal.
      - id: support_and_resistance
        name: Support and Resistance
        description: >
          Covers price levels where buying or selling pressure tends to appear,
          including horizontal support and resistance, dynamic support and
          resistance, supply and demand zones, prior highs and lows, failed
          breakouts, retests, and level-based trade planning.
      - id: chart_patterns_and_price_action
        name: Chart Patterns and Price Action
        description: >
          Covers recurring price formations and candle-by-candle behavior,
          including triangles, flags, head and shoulders, double tops and bottoms,
          breakouts, pullbacks, candlestick patterns, and price action setups.
      - id: volume_analysis
        name: Volume Analysis
        description: >
          Covers how trading volume is used to interpret the strength, weakness,
          or confirmation of price moves, including volume confirmation, volume
          spikes, accumulation, distribution, volume-price divergence, volume on
          breakouts, and institutional activity.
      - id: momentum_and_technical_indicators
        name: Momentum and Technical Indicators
        description: >
          Covers mathematical indicators used to measure trend strength, speed,
          overextension, or possible reversal conditions, including RSI, MACD,
          stochastic oscillator, moving averages, Bollinger Bands, momentum
          divergence, overbought or oversold conditions, and indicator-based
          signals.
      - id: market_structure_and_regime_identification
        name: Market Structure and Regime Identification
        description: >
          Covers how to recognize whether the market is trending, ranging,
          breaking out, reversing, or transitioning between phases, including
          ranges, consolidations, breakouts, trend phases, accumulation and
          distribution phases, volatility regimes, market cycles, and adapting
          trade setups to different conditions.

  - id: risk_management
    name: Risk Management
    description: >
      Covers the methods used to protect capital, control downside,
      and manage uncertainty in investing or trading decisions.
    leaf_concepts:
      - id: position_sizing
        name: Position Sizing
        description: >
          Determines how much capital to allocate to a single trade or investment
          based on account size, risk tolerance, and probability of loss.
      - id: stop_loss_and_exit_rules
        name: Stop-Loss and Exit Rules
        description: >
          Defines when to exit a losing position to prevent uncontrolled losses
          and enforce trade invalidation rules.
      - id: risk_reward_and_expectancy
        name: Risk-Reward and Expectancy
        description: >
          Explains the relationship between potential gain, potential loss,
          win rate, and long-run profitability.
      - id: drawdown_management
        name: Drawdown Management
        description: >
          Covers methods for surviving losing streaks, reducing damage during
          poor performance, and preserving capital during adverse conditions.
      - id: leverage_and_margin_risk
        name: Leverage and Margin Risk
        description: >
          Covers the risks created by borrowing capital, trading on margin,
          or using leveraged instruments that amplify both gains and losses.
      - id: exposure_and_concentration_limits
        name: Exposure and Concentration Limits
        description: >
          Covers the management of total exposure across positions, sectors,
          assets, or correlated trades to avoid excessive dependence on one view.

  - id: portfolio_construction_and_asset_allocation
    name: Portfolio Construction and Asset Allocation
    description: >
      Covers how investors combine assets into a portfolio, manage exposure
      across asset classes, and balance risk, return, diversification, and
      long-term objectives.
    leaf_concepts:
      - id: asset_allocation
        name: Asset Allocation
        description: >
          Covers how capital is distributed across major asset classes such as
          equities, bonds, cash, commodities, real estate, or cryptoassets,
          including strategic asset allocation, tactical asset allocation, and
          matching allocation to investment goals and risk tolerance.
      - id: diversification
        name: Diversification
        description: >
          Covers how portfolio risk can be reduced by spreading exposure across
          assets, sectors, geographies, strategies, or time horizons, including
          correlation, unsystematic risk, sector exposure, and geographic
          exposure.
      - id: portfolio_rebalancing
        name: Portfolio Rebalancing
        description: >
          Covers how portfolio weights are adjusted over time to maintain a
          target allocation or risk profile, including periodic rebalancing,
          threshold-based rebalancing, trimming winners, adding to underweighted
          assets, and maintaining portfolio discipline.
      - id: risk_return_tradeoff
        name: Risk-Return Tradeoff
        description: >
          Covers the relationship between expected return and the level of risk
          taken in a portfolio, including volatility, expected return, risk
          premiums, efficient frontier, Sharpe ratio, and drawdown uncertainty.
      - id: time_horizon_and_goal_based_investing
        name: Time Horizon and Goal-Based Investing
        description: >
          Covers how portfolio design depends on the investor's time horizon,
          liquidity needs, and financial objectives, including retirement
          investing, short-term versus long-term goals, investment horizon,
          age-based allocation, and future cash needs.
      - id: passive_vs_active_portfolio_management
        name: Passive vs Active Portfolio Management
        description: >
          Covers the comparison between index-based investing and active security
          selection, market timing, or tactical management, including index funds,
          ETFs, active management, passive investing, benchmark comparison,
          market efficiency, fund fees, and the difficulty of outperforming
          the market.

  - id: trading_psychology_and_behavioral_finance
    name: Trading Psychology and Behavioral Finance
    description: >
      Covers how emotions, cognitive biases, discipline, and decision-making
      patterns affect investing and trading behavior.
    leaf_concepts:
      - id: emotional_discipline
        name: Emotional Discipline
        description: >
          Covers how emotional reactions can distort trading or investing
          decisions, including fear, greed, panic selling, euphoria, frustration,
          revenge trading, impulsive entries, and staying calm under market
          pressure.
      - id: cognitive_biases
        name: Cognitive Biases
        description: >
          Covers systematic thinking errors that affect financial judgment,
          including confirmation bias, overconfidence, anchoring, recency bias,
          hindsight bias, survivorship bias, loss aversion, and the disposition
          effect.
      - id: loss_aversion_and_drawdown_psychology
        name: Loss Aversion and Drawdown Psychology
        description: >
          Covers why losses feel disproportionately painful and how that affects
          behavior during losing periods, including fear of loss, inability to cut
          losses, holding losers too long, avoiding trades after losses,
          emotional responses to drawdowns, and psychological recovery after
          losing streaks.
      - id: process_oriented_decision_making
        name: Process-Oriented Decision Making
        description: >
          Covers the importance of judging decision quality by repeatable process
          rather than short-term profit or loss, including trading plans,
          objective review, journaling, probabilistic thinking, and evaluating
          process over outcomes.
      - id: overtrading_and_impulse_control
        name: Overtrading and Impulse Control
        description: >
          Covers excessive trading caused by boredom, impatience, emotional
          urgency, or the need to be constantly active, including waiting for
          valid setups, avoiding forced trades, controlling trade frequency,
          patience, and impulse control.
      - id: probabilistic_thinking_and_uncertainty
        name: Probabilistic Thinking and Uncertainty
        description: >
          Covers the idea that investing and trading decisions are made under
          uncertainty, including probability, randomness, variance, expected
          outcomes, sample size, accepting being wrong, and thinking in
          distributions rather than certainties.

  - id: macro_cycles_and_economic_context
    name: Macro, Cycles, and Economic Context
    description: >
      Covers how broad economic forces, policy decisions, market cycles, and
      global conditions affect asset prices, investor behavior, and trading
      environments.
    leaf_concepts:
      - id: interest_rates_and_monetary_policy
        name: Interest Rates and Monetary Policy
        description: >
          Covers how central banks influence financial conditions through
          interest rates, liquidity, and monetary policy tools, including rate
          hikes, rate cuts, central banks, quantitative easing, quantitative
          tightening, liquidity, bond yields, and the effect of monetary policy
          on asset prices.
      - id: inflation_and_purchasing_power
        name: Inflation and Purchasing Power
        description: >
          Covers how rising or falling prices affect consumers, businesses,
          currencies, and investment returns, including inflation, deflation,
          purchasing power, real returns, cost of capital, inflation hedges,
          commodities, and the effect of inflation on valuation and portfolio
          decisions.
      - id: business_cycles_and_market_cycles
        name: Business Cycles and Market Cycles
        description: >
          Covers the recurring expansion and contraction of economic activity and
          how markets behave across different cycle phases, including recessions,
          expansions, recoveries, booms, busts, bull markets, bear markets, cycle
          timing, and asset performance across economic regimes.
      - id: currency_and_global_macro_forces
        name: Currency and Global Macro Forces
        description: >
          Covers how exchange rates, capital flows, global trade, and geopolitical
          conditions affect markets, including currencies, foreign exchange,
          dollar strength, trade balances, capital flows, emerging markets,
          geopolitical risk, and cross-border macro relationships.
      - id: credit_debt_and_financial_crises
        name: Credit, Debt, and Financial Crises
        description: >
          Covers how borrowing, leverage, credit conditions, and debt cycles
          create financial risk or market stress, including credit cycles, debt
          bubbles, banking stress, defaults, financial crises, liquidity crunches,
          leverage in the financial system, and systemic risk.
      - id: economic_indicators_and_data_interpretation
        name: Economic Indicators and Data Interpretation
        description: >
          Covers how macroeconomic data is used to understand the current
          economic environment and possible market implications, including GDP,
          unemployment, CPI, PPI, PMI, yield curves, consumer confidence, retail
          sales, housing data, and interpreting economic releases.

  - id: strategy_systems_and_execution
    name: Strategy, Systems, and Execution
    description: >
      Covers how traders and investors turn market knowledge into repeatable
      decision rules, testable strategies, execution workflows, and performance
      improvement systems.
    leaf_concepts:
      - id: strategy_design_and_rule_definition
        name: Strategy Design and Rule Definition
        description: >
          Covers how to create explicit rules for when to enter, exit, avoid, or
          manage a trade or investment, including trading rules, entry criteria,
          exit criteria, setup definitions, invalidation rules, decision
          checklists, and turning discretionary ideas into a repeatable framework.
      - id: backtesting_and_strategy_validation
        name: Backtesting and Strategy Validation
        description: >
          Covers how to test a strategy against historical data or past market
          examples to evaluate whether it has evidence of working, including
          backtesting, historical testing, sample size, false signals, overfitting,
          walk-forward testing, paper trading, and validating a strategy before
          risking real capital.
      - id: trade_planning_and_preparation
        name: Trade Planning and Preparation
        description: >
          Covers how to prepare a trade before execution by defining the thesis,
          setup, trigger, risk, target, and contingency plan, including
          pre-trade planning, watchlists, trade thesis, scenario planning, entry
          triggers, target setting, invalidation points, and planning before
          market open.
      - id: execution_quality_and_trade_implementation
        name: Execution Quality and Trade Implementation
        description: >
          Covers the practical process of carrying out trades efficiently and
          consistently, including order execution, slippage, spread costs,
          liquidity considerations, scaling in or out, timing entries, avoiding
          poor fills, and implementing trades according to plan.
      - id: journaling_and_performance_review
        name: Journaling and Performance Review
        description: >
          Covers how to record trades or investment decisions to identify
          patterns, mistakes, strengths, and areas for improvement, including
          trade journals, post-trade review, tracking mistakes, reviewing
          screenshots, measuring performance, identifying repeated errors, and
          learning from past decisions.
      - id: system_iteration_and_continuous_improvement
        name: System Iteration and Continuous Improvement
        description: >
          Covers how to improve a strategy or process over time based on evidence,
          feedback, and changing market conditions, including refining rules,
          adapting to new regimes, removing weak setups, improving edge, reviewing
          system performance, and using feedback loops to improve the process.
